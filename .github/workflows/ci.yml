name: PowerShell CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect PowerShell environment
        shell: pwsh
        run: |
          $PSVersionTable

      - name: Install Invoke-Build
        shell: pwsh
        run: |
          Install-Module -Name InvokeBuild -MinimumVersion 5.0.0 -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module -Name Pester -MinimumVersion 5.0.0 -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -MinimumVersion 1.21.0 -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Run build pipeline via Invoke-Build
        shell: pwsh
        run: |
          Invoke-Build